# CodeQL — fleet ADVANCED configuration (self-contained).
#
# Replaces the thin quality-zero-platform reusable-codeql.yml caller: that
# wrapper pins queries to security-and-quality only, while the fleet standard
# (owner decision) requires BOTH suites inline:
#   queries: security-extended,security-and-quality
# (security-extended + security-and-quality strictly subsumes the default
# suite and the extended suite.) Languages kept from the wrapper's profile:
# python + actions. The whole repository is scanned (no path restrictions);
# the repo's own quality gate (quality.yml -> QZP reusable-quality,
# deps-severity-floor: any, strict 100% line+branch asserted) keeps running
# beside this analysis unchanged.
name: codeql

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
